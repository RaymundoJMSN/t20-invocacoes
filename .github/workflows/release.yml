name: Release

# Tag v* → module.zip plano (module.json na raiz) + module.json apontando pra
# esta versão, os dois anexados na release. O manifest público é sempre
# .../releases/latest/download/module.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão e URLs no module.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "${TAG#v}" \
             --arg m "$REPO/releases/latest/download/module.json" \
             --arg d "$REPO/releases/download/$TAG/module.zip" \
             '.version=$v | .manifest=$m | .download=$d' module.json > /tmp/module.json
          mv /tmp/module.json module.json

      - name: Zip
        run: zip -r module.zip . -x ".git/*" ".github/*" "tools/*" "*.ps1" "test-*"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
